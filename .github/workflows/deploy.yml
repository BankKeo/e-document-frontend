name: Deploy Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/bankkeo/e-document-frontend

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bankkeo/e-document-frontend:latest
            ghcr.io/bankkeo/e-document-frontend:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check secrets exist
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "EC2_HOST length: ${#EC2_HOST}"
          echo "EC2_HOST value: [${EC2_HOST}]"
          echo "EC2_SSH_KEY length: ${#EC2_SSH_KEY}"
          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST is missing or empty"
            exit 1
          fi
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::EC2_SSH_KEY is missing or empty"
            exit 1
          fi
          printf '%s' "$EC2_SSH_KEY" > /tmp/ec2_key.pem
          echo "EC2_SSH_KEY first line: [$(head -1 /tmp/ec2_key.pem)]"
          echo "EC2_SSH_KEY last line: [$(tail -1 /tmp/ec2_key.pem)]"
          if grep -q $'\r' /tmp/ec2_key.pem; then
            echo "::error::EC2_SSH_KEY contains CRLF line endings - secret is corrupted"
            exit 1
          fi
          if ! grep -q "BEGIN" /tmp/ec2_key.pem; then
            echo "::error::EC2_SSH_KEY does not contain a BEGIN line"
            exit 1
          fi
          if ! grep -q "END" /tmp/ec2_key.pem; then
            echo "::error::EC2_SSH_KEY does not contain an END line - secret is truncated"
            exit 1
          fi
          if command -v ssh-keygen >/dev/null 2>&1; then
            if ssh-keygen -y -f /tmp/ec2_key.pem >/dev/null 2>&1; then
              echo "EC2_SSH_KEY parses OK with ssh-keygen"
            else
              echo "::error::EC2_SSH_KEY failed ssh-keygen parse"
              ssh-keygen -y -f /tmp/ec2_key.pem 2>&1 || true
              exit 1
            fi
          fi

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /opt/my-app

            docker pull ghcr.io/bankkeo/e-document-frontend:latest

            docker compose down

            docker compose up -d

            docker image prune -f
